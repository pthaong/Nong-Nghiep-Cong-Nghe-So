spring.application.name=backend

# ==============================
# SQL SERVER
# ==============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SmartAgriculture;encrypt=true;trustServerCertificate=true
spring.datasource.username=smartagri_app
spring.datasource.password=SmartAgri@123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# ==============================
# GEMINI AI
# ==============================
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.8-flash