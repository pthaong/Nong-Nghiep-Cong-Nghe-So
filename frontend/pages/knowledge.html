<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSmart - Nhật ký canh tác</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #0b120d;
            color: #f1f3eb;
        }
        .shell {
            max-width: 900px;
            margin: 60px auto;
            padding: 24px;
            background: #131d15;
            border: 1px solid #29362a;
            border-radius: 18px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .back-link {
            color: #8ed0ff;
            text-decoration: none;
            font-weight: 600;
        }
        .entry {
            background: #18241a;
            border: 1px solid #2d3a2d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .time {
            color: #8f9c8d;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="topbar">
            <div>
                <h1 class="mb-1">Nhật ký canh tác</h1>
                <div class="time">Ghi nhận hoạt động mặt ruộng</div>
            </div>
            <a class="back-link" href="home.html"><i class="bi bi-arrow-left"></i> Trang chủ</a>
        </div>

        <div class="entry">
            <div class="time">Hôm nay • 06:30</div>
            <h3>Kiểm tra mực nước ruộng số 1</h3>
            <p>Đã duy trì mức 4cm, phù hợp với giai đoạn đẻ nhánh.</p>
        </div>

        <div class="entry">
            <div class="time">Hôm qua • 17:45</div>
            <h3>Phun thuốc phòng nấm</h3>
            <p>Phun theo khuyến nghị AI, đề phòng nấm bệnh vì độ ẩm cao.</p>
        </div>
    </div>
</body>
</html>
