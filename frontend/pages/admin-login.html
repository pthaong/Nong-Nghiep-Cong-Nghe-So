<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập quản trị | AgriSmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
<div id="loginScreen" aria-live="polite">
  <div class="login-card auth-card">
    <div class="login-visual">
      <div class="brand"><span class="dot"></span> AgriSmart</div>
      <div>
        <span class="auth-kicker">AGRISMART · QUẢN TRỊ HỆ THỐNG</span>
        <h2>Khu vực dành cho quản trị viên.</h2>
        <p>Đăng nhập bằng tài khoản Admin để quản lý tài khoản nông dân.</p>
      </div>
    </div>

    <div class="login-form-wrap auth-form-wrap">
      <section class="auth-view active">
        <div class="auth-heading">
          <span class="auth-icon"><i class="bi bi-shield-lock"></i></span>
          <div>
            <h4 class="mb-1">Đăng nhập quản trị</h4>
            <p class="text-muted2 mb-0">Chỉ tài khoản có quyền Admin mới được truy cập.</p>
          </div>
        </div>

        <div class="auth-alert" id="adminLoginAlert" role="alert"></div>

        <form id="adminLoginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="adminEmail">Email</label>
            <input type="email" class="form-control auth-input" id="adminEmail"
                   autocomplete="username" placeholder="admin@example.com" required>
            <div class="invalid-feedback" id="adminEmailError"></div>
          </div>

          <div class="mb-4">
            <label class="form-label" for="adminPass">Mật khẩu</label>
            <div class="password-field">
              <input type="password" class="form-control auth-input" id="adminPass"
                     autocomplete="current-password" placeholder="Nhập mật khẩu" required>
              <button type="button" class="password-toggle" id="adminPassToggle" aria-label="Hiện mật khẩu">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback" id="adminPassError"></div>
          </div>

          <button class="btn btn-forest w-100 py-2 fw-semibold auth-submit" id="adminLoginSubmit" type="submit">
            <span class="btn-label">Đăng nhập</span>
            <span class="btn-spinner spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          </button>
        </form>

        <div class="auth-switch">
          <a href="../index.html" class="auth-link-btn">
            <i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập nông dân
          </a>
        </div>
      </section>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/services/auth-service.js"></script>
<script src="../js/admin-login.js"></script>
</body>
</html>
