<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AgriSmart - Thông báo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/home.css">

<link
    rel="stylesheet"
    href="../css/notification.css"
>
</head>

<body>
    <div class="app-shell">

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <span class="dot"></span> AgriSmart
        </div>

        <div class="sidebar-scroll">

            <a class="nav-link-app" href="home.html">
                <i class="bi bi-house-door"></i>
                <span>Trang chủ</span>
            </a>

            <a class="nav-link-app" href="plants.html">
                <i class="bi bi-flower2"></i>
                <span>Cây trồng</span>
            </a>

            <a class="nav-link-app" href="seasons.html">
                <i class="bi bi-calendar3-range"></i>
                <span>Mùa vụ</span>
            </a>

            <a class="nav-link-app" href="nhatky-index.html">
                <i class="bi bi-journal-text"></i>
                <span>Nhật ký canh tác</span>
            </a>

            <a class="nav-link-app" href="weather.html">
                <i class="bi bi-cloud-sun"></i>
                <span>Thời tiết</span>
            </a>

            <a class="nav-link-app" href="aichandoan-index.html">
                <i class="bi bi-robot"></i>
                <span>AI chẩn đoán &amp; tư vấn</span>
            </a>

            <div class="nav-section-label">Khác</div>

            <a class="nav-link-app" href="prices.html">
                <i class="bi bi-graph-up-arrow"></i>
                <span>Giá nông sản</span>
            </a>

            <a class="nav-link-app" href="profile.html">
                <i class="bi bi-person-circle"></i>
                <span>Tài khoản</span>
            </a>

            <a class="nav-link-app active" href="notification.html">
                <i class="bi bi-bell"></i>
                <span>Thông báo</span>
            </a>

        </div>
        <div class="sidebar-foot">
            <div class="mini-user">
                <div class="mini-avatar">N</div>

                <div class="mini-user-info">
                    <div class="mini-user-name">Nông dân</div>
                    <div class="mini-user-location">
                        <i class="bi bi-geo-alt-fill"></i>
                        AgriSmart
                    </div>
                </div>
            </div>

            <button type="button" class="sidebar-logout">
                <i class="bi bi-box-arrow-left"></i>
                Đăng xuất
            </button>
        </div>
    </aside>

    <div class="main-col">

    <!-- HEADER -->

    <header class="notif-header">

        <div>

            <h1>
                Thông báo
                <span
                    id="unreadBadge"
                    class="notif-unread-badge"
                    hidden
                >0</span>
            </h1>

            <p id="unreadSummary">Cập nhật mới nhất từ AgriSmart</p>

        </div>

        <a
            href="home.html"
            class="back-home"
        >
            <i class="bi bi-house"></i>
            Trang chủ
        </a>

    </header>


    <!-- MAIN -->

    <main class="notif-container">

        <!-- Lỗi khi đánh dấu đã đọc / xóa -->
        <div
            id="actionError"
            class="notif-action-error"
            role="alert"
            hidden
        ></div>

        <!-- LOADING -->
        <section
            id="stateLoading"
            class="notif-state"
            aria-live="polite"
        >
            <div
                class="spinner-border text-success"
                role="status"
            ></div>
            <p>Đang tải thông báo...</p>
        </section>

        <!-- ERROR -->
        <section
            id="stateError"
            class="notif-state"
            role="alert"
            hidden
        >
            <i class="bi bi-exclamation-triangle notif-state-icon error"></i>
            <p>Không thể tải thông báo. Vui lòng thử lại.</p>
            <button
                id="retryButton"
                type="button"
                class="notif-btn primary"
            >
                <i class="bi bi-arrow-clockwise"></i>
                Thử lại
            </button>
        </section>

        <!-- EMPTY -->
        <section
            id="stateEmpty"
            class="notif-state"
            hidden
        >
            <i class="bi bi-bell-slash notif-state-icon"></i>
            <p>Bạn chưa có thông báo nào.</p>
            <button
                id="resetMockButton"
                type="button"
                class="notif-btn"
                hidden
            >
                Khôi phục dữ liệu mẫu
            </button>
        </section>

        <!-- LIST -->
        <ul
            id="notificationList"
            class="notif-list"
            hidden
        ></ul>

    </main>


    <script src="../js/config.js"></script>
    <script src="../js/services/notification-service.js"></script>
    <script src="../js/notification.js"></script>
    <script src="../js/logout.js"></script>
    </div>
</div>
</body>

</html>
