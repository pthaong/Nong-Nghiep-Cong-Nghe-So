<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AgriSmart - Thông báo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/notification.css"
    >
</head>

<body>

    <!-- HEADER -->

    <header class="notif-header">

        <div>

            <h1>
                Thông báo
                <span
                    id="unreadBadge"
                    class="notif-unread-badge"
                    hidden
                >0</span>
            </h1>

            <p id="unreadSummary">Cập nhật mới nhất từ AgriSmart</p>

        </div>

        <a
            href="home.html"
            class="back-home"
        >
            <i class="bi bi-house"></i>
            Trang chủ
        </a>

    </header>


    <!-- MAIN -->

    <main class="notif-container">

        <!-- Lỗi khi đánh dấu đã đọc / xóa -->
        <div
            id="actionError"
            class="notif-action-error"
            role="alert"
            hidden
        ></div>

        <!-- LOADING -->
        <section
            id="stateLoading"
            class="notif-state"
            aria-live="polite"
        >
            <div
                class="spinner-border text-success"
                role="status"
            ></div>
            <p>Đang tải thông báo...</p>
        </section>

        <!-- ERROR -->
        <section
            id="stateError"
            class="notif-state"
            role="alert"
            hidden
        >
            <i class="bi bi-exclamation-triangle notif-state-icon error"></i>
            <p>Không thể tải thông báo. Vui lòng thử lại.</p>
            <button
                id="retryButton"
                type="button"
                class="notif-btn primary"
            >
                <i class="bi bi-arrow-clockwise"></i>
                Thử lại
            </button>
        </section>

        <!-- EMPTY -->
        <section
            id="stateEmpty"
            class="notif-state"
            hidden
        >
            <i class="bi bi-bell-slash notif-state-icon"></i>
            <p>Bạn chưa có thông báo nào.</p>
            <button
                id="resetMockButton"
                type="button"
                class="notif-btn"
                hidden
            >
                Khôi phục dữ liệu mẫu
            </button>
        </section>

        <!-- LIST -->
        <ul
            id="notificationList"
            class="notif-list"
            hidden
        ></ul>

    </main>


    <script src="../js/config.js"></script>
    <script src="../js/services/notification-service.js"></script>
    <script src="../js/notification.js"></script>

</body>

</html>
