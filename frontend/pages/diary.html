<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSmart - Mùa vụ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #0b120d;
            color: #f1f3eb;
        }
        .shell {
            max-width: 1000px;
            margin: 60px auto;
            padding: 24px;
            background: #131d15;
            border: 1px solid #29362a;
            border-radius: 18px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .back-link {
            color: #8ed0ff;
            text-decoration: none;
            font-weight: 600;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .card {
            background: #18241a;
            border: 1px solid #2d3a2d;
            border-radius: 14px;
            padding: 18px;
        }
        .card h3 {
            font-size: 18px;
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .meta {
            color: #b8c7b2;
            font-size: 13px;
        }
        @media (max-width: 768px) {
            .card-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="topbar">
            <div>
                <h1 class="mb-1">Mùa vụ</h1>
                <div class="meta">Quản lý kế hoạch canh tác theo vụ</div>
            </div>
            <a class="back-link" href="home.html"><i class="bi bi-arrow-left"></i> Trang chủ</a>
        </div>

        <div class="card-grid">
            <div class="card">
                <div class="meta"><i class="bi bi-calendar3-range"></i> Vụ Đông Xuân</div>
                <h3>Vụ 2026</h3>
                <div class="meta">Đang lên kế hoạch: 68%</div>
            </div>
            <div class="card">
                <div class="meta"><i class="bi bi-sun"></i> Tưới tiêu</div>
                <h3>Thời điểm thích hợp</h3>
                <div class="meta">Tối ưu vào 6:00–8:00</div>
            </div>
            <div class="card">
                <div class="meta"><i class="bi bi-shield-check"></i> Chăm sóc</div>
                <h3>Giám sát bệnh</h3>
                <div class="meta">Cần kiểm tra 2 lần/tuần</div>
            </div>
        </div>
    </div>
</body>
</html>
