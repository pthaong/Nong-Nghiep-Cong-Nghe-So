<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AgriSmart - Hồ sơ cá nhân</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/profile.css"
    >
</head>

<body>

    <!-- HEADER -->

    <header class="profile-header">

        <div>

            <h1>Hồ sơ cá nhân</h1>

            <p>Quản lý thông tin tài khoản của bạn</p>

        </div>

        <a
            href="home.html"
            class="back-home"
        >
            <i class="bi bi-house"></i>
            Trang chủ
        </a>

    </header>


    <!-- MAIN -->

    <main class="profile-container">

        <!-- PROFILE CARD -->

        <section class="profile-card">

            <div class="profile-top">

                <div class="avatar">

                    <i class="bi bi-person-fill"></i>

                </div>

                <div>

                    <h2 id="profileNameTitle">
                        Đang tải...
                    </h2>

                    <p>
                        Nông dân
                    </p>

                </div>

            </div>


            <!-- MESSAGE -->

            <div
                id="profileMessage"
                class="profile-message"
                role="alert"
            ></div>


            <!-- FORM -->

            <form id="profileForm">

                <!-- HỌ TÊN -->

                <div class="form-group">

                    <label for="profileName">
                        Họ và tên
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-person"></i>

                        <input
                            type="text"
                            id="profileName"
                            name="name"
                            placeholder="Nhập họ và tên"
                            required
                            disabled
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="profileEmail">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="profileEmail"
                            name="email"
                            placeholder="Email"
                            disabled
                        >

                    </div>

                    <small>
                        Email được sử dụng để xác định tài khoản.
                    </small>

                </div>


                <!-- SỐ ĐIỆN THOẠI -->

                <div class="form-group">

                    <label for="profilePhone">
                        Số điện thoại
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-telephone"></i>

                        <input
                            type="tel"
                            id="profilePhone"
                            name="phone"
                            placeholder="Nhập số điện thoại"
                            required
                            disabled
                        >

                    </div>

                </div>

                <div class="form-group">
                    <label for="profileArea">Khu vực</label>

                    <div class="input-wrapper">
                        <i class="bi bi-geo-alt"></i>

                        <input
                            type="text"
                            id="profileArea"
                            name="area"
                            value="Hà Nội"
                            placeholder="Khu vực"
                            disabled
                        >
                    </div>

                    <small>
                            Thông tin khu vực hiện đang sử dụng dữ liệu mẫu.
                    </small>
                </div>
            


                <!-- BUTTONS -->

                <div class="profile-actions">

                    <button
                        type="button"
                        id="editProfileButton"
                        class="btn-edit"
                    >
                        <i class="bi bi-pencil"></i>
                        Chỉnh sửa thông tin
                    </button>


                    <button
                        type="button"
                        id="cancelProfileButton"
                        class="btn-cancel"
                        hidden
                    >
                        Hủy
                    </button>


                    <button
                        type="submit"
                        id="saveProfileButton"
                        class="btn-save"
                        hidden
                    >
                        <i class="bi bi-check-lg"></i>
                        Lưu thay đổi
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script src="../js/config.js"></script>
    <script src="../js/profile.js"></script>


</body>

</html>
