<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AgriSmart - Sắp ra mắt</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/coming-soon.css"
    >
</head>

<body>

    <main class="soon-card">

        <div class="soon-icon">
            <i
                id="soonIcon"
                class="bi bi-hourglass-split"
            ></i>
        </div>

        <span class="soon-tag">Sắp ra mắt</span>

        <h1 id="soonTitle">Tính năng</h1>

        <p id="soonDescription">
            Tính năng này đang được phát triển và sẽ sớm có mặt.
        </p>

        <a
            href="home.html"
            class="soon-back"
        >
            <i class="bi bi-house"></i>
            Về trang chủ
        </a>

    </main>

    <script>

        /*
         * Placeholder dùng chung cho các module chưa có trang riêng.
         * Chọn nội dung bằng ?module=diary | knowledge.
         * Khi module thật hoàn thành, chỉ cần đổi link trên Home.
         */

        (function () {

            var MODULES = {
                diary: {
                    title: "Nhật ký canh tác",
                    icon: "bi-journal-text",
                    description: "Ghi chép công việc đồng ruộng hằng ngày sẽ sớm có mặt."
                },
                knowledge: {
                    title: "Kiến thức nông nghiệp",
                    icon: "bi-book",
                    description: "Thư viện kỹ thuật và mẹo canh tác đang được chuẩn bị."
                }
            };

            var key = new URLSearchParams(window.location.search).get("module");
            var info = Object.prototype.hasOwnProperty.call(MODULES, key)
                ? MODULES[key]
                : null;

            if (!info) {
                return;
            }

            document.title = "AgriSmart - " + info.title;
            document.getElementById("soonTitle").textContent = info.title;
            document.getElementById("soonDescription").textContent = info.description;
            document.getElementById("soonIcon").className = "bi " + info.icon;

        })();

    </script>

</body>

</html>
